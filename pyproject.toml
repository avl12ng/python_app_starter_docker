[project]
name = "python-app-starter"
version = "0.1.0"
description = "Squelette d'application web Python (FastAPI) avec authentification sécurisée et charte graphique de digitization_commercial"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=43",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=8.0",
    "email-validator>=2.2",
    "openpyxl>=3.1",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]
