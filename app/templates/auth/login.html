{% extends "auth_layout.html" %}
{% block title %}Connexion{% endblock %}
{% block heading %}Connexion{% endblock %}
{% block content %}
<form method="post" action="/login" class="form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="username">Identifiant</label>
    <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus>
  </div>
  <div class="field">
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn-primary-brand btn-block">Se connecter</button>
</form>
<div class="auth-links">
  <a href="/password/forgot">Mot de passe oublié ?</a>
</div>
<p class="auth-foot">{{ settings.app_name }}</p>
{% endblock %}
